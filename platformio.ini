[platformio]
default_envs = esp32s3
src_dir = oled_portfolio

[env]
framework = arduino
lib_deps =
    adafruit/Adafruit ILI9341
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO

; ESP32-S3-WROOM-1 N16R8: 16 MB Quad flash + 8 MB Octal PSRAM.
; Upload/serial use the USB-to-UART connector, not native USB CDC.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_flags = -DBOARD_HAS_PSRAM
monitor_speed = 115200
upload_speed = 460800

; Classic ATmega328P Nano with the newer bootloader.
[env:nano]
platform = atmelavr
board = nanoatmega328new

; Use this environment for Nanos with the older bootloader.
[env:nano_old_bootloader]
platform = atmelavr
board = nanoatmega328
